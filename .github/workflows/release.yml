name: Release

on:
  push:
    tags:
    - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        filter: blob:none
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
    - name: Build and Test
      run: make
  image:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      platforms: linux/amd64,linux/arm64
      push: true
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
