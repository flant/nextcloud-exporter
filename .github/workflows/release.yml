name: Release

# The "published" type fires both when a release is created directly and when an
# existing draft is published, which "created" misses. A release built from a tag
# that already exists emits no push event at all, so this is the only trigger.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        filter: blob:none
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
    - name: Build and Test
      run: make
  image:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      platforms: linux/amd64,linux/arm64
      push: true
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
